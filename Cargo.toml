[package]
name = "git-secret-hunter"
version = "0.2.0"
edition = "2024"
description = "High-speed Git history secret scanner & AI API key auditor"
license = "MIT"
repository = "https://github.com/kirillsql1kaa11/Git-Secret-Hunter"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
rayon = "1.10"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3.10"
rand = "0.8"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts"] }
rfd = { version = "0.17", optional = true }

[[bin]]
name = "git-secret-hunter"
path = "src/main.rs"

[[bin]]
name = "git-secret-hunter-gui"
path = "src/bin/git-secret-hunter-gui.rs"
required-features = ["gui"]
